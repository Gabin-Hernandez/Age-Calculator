<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/monkey-25-32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=Karla:ital,wght@0,200..800;1,200..800&family=League+Spartan:wght@100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Overpass:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Young+Serif&display=swap"
      rel="stylesheet"
    />

    <title>Age calculator app</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 11px;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
      .body {
        background-color: hsl(0, 0%, 94%);
        margin: 0px;
        display: grid;
        place-content: center;
        min-height: 100vh;
        font-family: "Poppins", sans-serif;

      }
      .main {
        background-color: white;
        border-radius: 10px 10px 100px 10px;
        height: auto;
        max-width: 440px;
        width: 90%;
        padding: 2rem;

      }
      .inputs {
        width: 50%;
        display: flex;
        margin-bottom: 1rem;
        margin: 20px;
      }
      .input-group {
        width: 40%;
        padding-left: 10px;
        display: flex;
        flex-direction: column;
      }
      .input-group label {
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: hsl(0, 1%, 44%);
        margin-bottom: 0.25rem;
      }
      .input-group input {
        padding: 0.5rem;
        font-size: 1rem;
        font-weight: 700;
        border: 1px solid hsl(0, 1%, 80%);
        border-radius: 5px;
      }

      .submit {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 1rem;
        width: 100%;
      }
      .result {
        display: flex;
        font-size: 2rem;
        gap: 1rem;
        margin: 20px;
      }
      .numbers {
        color: hsl(259, 100%, 65%);
        font-weight: bolder;
        font-weight: 900;
      }
      .numbers p {
        margin: 0.25rem 0;
      }
      .text {
        font-weight: 800;
      }
      .text p {
        margin: 0.25rem 0;
      }
      .hr {
        width: 100%;
        border: none;
        border-top: 1px solid hsl(0, 1%, 80%);
      }
      .btn {
        background-color: hsl(259, 100%, 65%);
        border: none;
        border-radius: 50%;
        width: 60px;
        height: 60px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .btn:hover {
        background-color: black;
      }
      .btn img {
        width: 20px;
        height: 20px;
      }
      @media (max-width: 840px) {
        .main {
          width: 100%;
        }
        .inputs {
          width: 70%;
        }
        .result {
          margin-left: 62px;
        }
        .hr {
          margin-left: 12px;
        }
      }
    </style>
  </head>
  <body class="body">
    <main class="main">
      <!-- INPUTS A LLENAR -->
      <div class="inputs">
        <!-- INPUT DE DIA -->
        <div class="input-group">
          <label for="day">DAY</label>
          <input id="day" type="number" placeholder="DD" />
        </div>
        <!-- INPUT DE MES -->
        <div class="input-group">
          <label for="month">MONTH</label>
          <input id="month" type="number" placeholder="MM" />
        </div>
        <!-- INPUT DE AÑO -->
        <div class="input-group">
          <label for="year">YEAR</label>
          <input id="year" type="number" placeholder="YYYY" />
        </div>
      </div>
      <!-- FIN DE LOS INPUTS -->

      <div class="submit">
        <hr class="hr" />
        <button id="button" class="btn">
          <img src="./assets/images/icon-arrow.svg" alt="" />
        </button>
      </div>

      <div class="result">
        <div class="numbers">
          <p>--</p>
          <p>--</p>
          <p>--</p>
        </div>
        <div class="text">
          <p>years</p>
          <p>months</p>
          <p>days</p>
        </div>
      </div>
    </main>
    <div class="attribution">
      Coded by <a href="https://github.com/Gabin-Hernandez?tab=repositories">Gabin Hernandez</a>.
    </div>
    <script src="./calculator.js"></script>
  </body>
</html>
